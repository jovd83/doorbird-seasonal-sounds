# Alembic replaces the hand-rolled `PRAGMA table_info` / `ALTER TABLE` ladder
# that used to live in app/db.py: eleven conditional blocks with no version
# table, no down path, and no way to tell which of them a given database had
# already seen.
#
# The database URL is not set here. It comes from `app.config.settings` in
# env.py, so the migrations always target the same file the app does.
[alembic]
script_location = app/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
