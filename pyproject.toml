[project]
name = "doorbird-seasonal"
version = "0.2.0"
description = "Schedule seasonal button sounds across DoorBird door stations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "mutagen>=1.47",
    "cryptography>=43.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "discovery"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "C4",     # comprehensions
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "PIE",
    "DTZ",    # naive datetimes
    "S",      # bandit-style security checks
]
ignore = [
    # This app stores and displays wall-clock time in one configured zone and
    # keeps it naive on purpose -- SQLite has no timezone type, and the whole
    # codebase reads and writes through `app.timezone`. See its module
    # docstring. Making these aware would change what is written to the
    # database, not just what ruff thinks of it.
    "DTZ001", "DTZ005", "DTZ007", "DTZ011",
    # `assert` is how the tests are written, and `except ... : pass` is
    # justified in place where it appears.
    "S101",
    # Door stations use self-signed certificates on a LAN and are addressed by
    # IP, so TLS verification cannot succeed. The one outbound call that goes
    # somewhere else -- the webhook relay -- does verify; see routes/ring_hook.
    "S501",
    # Subprocess use is deliberate and the argv is built from constants.
    "S603", "S607",
    # En dashes are used throughout the prose in docstrings and user-facing
    # strings. They are intentional typography, not a homoglyph attack.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency-injection API is function calls in parameter
# defaults. B008 is right in general and wrong for every one of these.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Form",
    "fastapi.File", "fastapi.Body", "fastapi.Header", "fastapi.Path",
]

[tool.ruff.lint.per-file-ignores]
# Test modules import after conftest has pinned DATA_DIR, which must happen
# before `app.config` is first imported. The "hardcoded password" findings are
# fixture credentials for a stubbed door station, and the RNG is seeded on
# purpose to keep the collection tests deterministic. `dict(a=1)` is used in
# the fixture tables because the keyword form keeps them readable as tables.
"tests/*" = ["E402", "S105", "S106", "S311", "C408"]
# Two column-aligned tables -- the icon paths and the NAV list -- that read far
# better wide than wrapped, plus inline SVG markup that cannot be broken up
# without making it harder to follow.
"app/templating.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Starlette's TestClient still imports httpx; not ours to fix.
    "ignore::DeprecationWarning:starlette.testclient",
]
